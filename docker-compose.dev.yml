# Development-only compose stack: Telegram bot + Mini App API + Vite frontend,
# all sharing a single SQLite database on the ``schooldata`` volume.
#
# This does NOT replace the production bot image (./Dockerfile). It is meant for
# local development of the web app only. SQLite + a shared file means this stack
# is single-host and for light load only (see docs/WEB_APP_ARCHITECTURE.md).
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:5173 (the frontend proxies /api to the API).

services:
  # Applying migrations is its own step — the bot no longer does it at startup,
  # and it refuses to run against a schema that is not at head. Runs to
  # completion before anything else starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: migrate
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/school_bot.db
    volumes:
      - schooldata:/data

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/school_bot.db
    volumes:
      - schooldata:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:////data/school_bot.db
    ports:
      - "8000:8000"
    volumes:
      - schooldata:/data
      # Live-reload the API on code changes during development.
      - ./web_api:/app/web_api
      - ./application:/app/application
      - ./services:/app/services
      - ./database:/app/database
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    depends_on:
      - api

volumes:
  schooldata:
