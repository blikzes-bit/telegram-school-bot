name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  # Pinned on purpose: `uv audit` is still an experimental command, so an
  # unattended uv upgrade must not be able to change or break the audit step.
  UV_VERSION: "0.11.31"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The interpreter comes from .python-version, so CI, the Docker image and
      # a local checkout all run the same one.
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy .

      - name: Test with coverage
        run: uv run pytest --cov=. --cov-report=term-missing --cov-report=xml

      # Production dependencies only, matching the previous pip-audit scope.
      - name: Dependency vulnerability audit
        run: uv audit --frozen --no-dev

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
