[project]
name = "telegram-school-bot"
version = "1.0.0"
description = "Telegram bot and Mini App for a school class: schedule, homework and reminders"
requires-python = ">=3.14"
license = { text = "MIT" }

# Exact pins, deliberately. The lockfile makes installs reproducible, but the
# pins keep the intended version visible in review and unchanged for anyone
# installing without uv.
dependencies = [
    "aiogram==3.29.1",
    "SQLAlchemy==2.0.51",
    "greenlet==3.5.3",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "APScheduler==3.11.3",
    "python-dotenv==1.2.2",
    "pytz==2026.2",
]

# Installed on top of the base set when running the Mini App API. The bot does
# not need them, but they are cheap and the single image runs both roles.
[project.optional-dependencies]
web = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

# Test and lint tooling. Never installed into the production image.
# Vulnerability scanning is `uv audit`, so no separate auditor is needed here.
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "httpx==0.28.1",
]

[tool.setuptools]
# The project is an application, not a distributable library: it is run from a
# checkout or copied into an image, never `pip install`-ed as a package. This
# keeps the build backend from trying to auto-discover packages and failing on
# the flat layout (bot.py, handlers/, services/, ...).
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Ruff's default rule set, written out explicitly. There was no ruff config
# before this file, so the linter ran on defaults — pinning them keeps this
# migration behaviour-preserving. Widening the set (isort, pyupgrade, bugbear)
# is worth doing, but as its own change: it touches hundreds of lines and would
# bury the packaging diff.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = "^(alembic/|tests/)"

# The project uses SQLAlchemy's legacy `Column(...)` declarative style (not
# `Mapped[...]`) and aiogram's `CallbackQuery.message` is typed as
# `Message | InaccessibleMessage | None`. Both are accurate-but-noisy for a
# codebase that doesn't fully annotate around them; disabling these classes
# keeps mypy useful for catching real logic errors (undefined names, wrong
# call signatures) without hundreds of framework-typing false positives.
disable_error_code = [
    "union-attr", "arg-type", "no-redef", "override", "assignment",
    "misc", "index", "attr-defined", "return-value", "call-overload",
]
